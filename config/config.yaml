# PAI-IR Main System Configuration

system:
  name: "PHYSICAL AI INDUSTRIAL ROBOT"
  short_name: "PAI-IR"
  version: "1.0.0"
  mode: "SIMULATION" # SIMULATION | LOCAL_DEV | ROS2_HARDWARE | EDGE_AI
  debug: true

backend:
  host: "0.0.0.0"
  port: 8000
  websocket_port: 8000
  telemetry_rate_hz: 10

database:
  driver: "sqlite"
  database_url: "sqlite:///./database/pai_ir.db"

logging:
  level: "INFO"
  format: "json"
